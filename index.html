<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>할 일</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1f2328; --sub: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --danger: #dc2626; --warn: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1b1f24; --text: #e6e8eb; --sub: #9aa3ad; --line: #2b3138; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif;
    padding: env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom));
  }
  header { padding: 18px 16px 6px; display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 24px; margin: 0; }
  #count { color: var(--sub); font-size: 14px; }
  .tabs { display: flex; gap: 6px; padding: 8px 16px; }
  .tabs button {
    flex: 1; padding: 8px 0; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--sub); font-size: 14px;
  }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  ul { list-style: none; margin: 0; padding: 4px 12px; }
  li {
    display: flex; align-items: center; gap: 10px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 8px 0;
  }
  li.done .title { text-decoration: line-through; color: var(--sub); }
  .chk {
    width: 26px; height: 26px; flex: none; border-radius: 50%;
    border: 2px solid var(--accent); background: none; padding: 0; color: #fff; font-size: 15px;
  }
  li.done .chk { background: var(--accent); }
  .body { flex: 1; min-width: 0; }
  .title { word-break: break-word; }
  .meta { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .meta .late { color: var(--danger); font-weight: 600; }
  .meta .soon { color: var(--warn); font-weight: 600; }
  .star { color: #f59e0b; }
  .del { border: none; background: none; color: var(--sub); font-size: 20px; padding: 4px 6px; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  .group { font-size: 13px; color: var(--sub); padding: 10px 16px 0; }
  form {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
    border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: 1fr auto; gap: 8px;
  }
  form input[type=text] {
    font-size: 16px; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  form .row { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--sub); }
  form input[type=date] {
    padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  .add { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 18px; font-size: 16px; }
  .tools { display: flex; gap: 8px; justify-content: center; padding: 16px; }
  .tools button {
    border: 1px solid var(--line); background: var(--card); color: var(--sub);
    border-radius: 8px; padding: 6px 10px; font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>할 일</h1>
  <span id="count"></span>
</header>
<div class="tabs">
  <button data-f="todo" class="on">남은 일</button>
  <button data-f="all">전체</button>
  <button data-f="done">완료</button>
</div>
<div id="list"></div>
<div class="tools">
  <button id="clearDone">완료 항목 지우기</button>
  <button id="export">백업 저장</button>
  <button id="import">백업 불러오기</button>
  <input type="file" id="file" accept="application/json" hidden>
</div>

<form id="form" autocomplete="off">
  <input type="text" id="text" placeholder="할 일 입력" enterkeyhint="done">
  <button class="add" type="submit">추가</button>
  <div class="row">
    마감 <input type="date" id="due">
    <label><input type="checkbox" id="imp"> 중요</label>
  </div>
</form>

<script>
const KEY = "todo-items-v1";
const $ = (s) => document.querySelector(s);
let filter = "todo";
let items = load();

function load() {
  const raw = localStorage.getItem(KEY);
  return raw ? JSON.parse(raw) : [];
}
function save() { localStorage.setItem(KEY, JSON.stringify(items)); }

function today() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function dueLabel(due) {
  if (!due) return "";
  const [y, m, d] = due.split("-").map(Number);
  const diff = Math.round((new Date(y, m - 1, d) - today()) / 86400000);
  const txt = `${m}/${d}`;
  if (diff < 0) return `<span class="late">${txt} · ${-diff}일 지남</span>`;
  if (diff === 0) return `<span class="late">${txt} · 오늘</span>`;
  if (diff <= 3) return `<span class="soon">${txt} · D-${diff}</span>`;
  return `${txt} · D-${diff}`;
}
function sortKey(a, b) {
  if (a.done !== b.done) return a.done ? 1 : -1;
  if (a.imp !== b.imp) return a.imp ? -1 : 1;
  return (a.due || "9999") < (b.due || "9999") ? -1 : (a.due || "9999") > (b.due || "9999") ? 1 : a.id - b.id;
}
function esc(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function render() {
  const shown = items
    .filter((t) => filter === "all" || (filter === "done" ? t.done : !t.done))
    .sort(sortKey);
  const left = items.filter((t) => !t.done).length;
  $("#count").textContent = `남은 일 ${left}개`;
  if (!shown.length) {
    $("#list").innerHTML = `<div class="empty">${filter === "done" ? "완료한 일이 없어요" : "할 일이 없어요 🎉"}</div>`;
    return;
  }
  $("#list").innerHTML = "<ul>" + shown.map((t) => `
    <li class="${t.done ? "done" : ""}" data-id="${t.id}">
      <button class="chk" data-act="toggle">${t.done ? "✓" : ""}</button>
      <div class="body" data-act="edit">
        <div class="title">${t.imp ? '<span class="star">★</span> ' : ""}${esc(t.text)}</div>
        ${t.due ? `<div class="meta">${dueLabel(t.due)}</div>` : ""}
      </div>
      <button class="del" data-act="del" aria-label="삭제">×</button>
    </li>`).join("") + "</ul>";
}

$("#list").addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  const li = e.target.closest("li");
  if (!act || !li) return;
  const t = items.find((x) => x.id === Number(li.dataset.id));
  if (act === "toggle") t.done = !t.done;
  if (act === "del") {
    if (!confirm(`"${t.text}" 삭제할까요?`)) return;
    items = items.filter((x) => x !== t);
  }
  if (act === "edit") {
    const text = prompt("내용 수정", t.text);
    if (text === null) return;
    if (text.trim()) t.text = text.trim();
    const due = prompt("마감일 (예: 2026-11-10, 비우면 없음)", t.due || "");
    if (due !== null) t.due = /^\d{4}-\d{2}-\d{2}$/.test(due.trim()) ? due.trim() : "";
  }
  save(); render();
});

$("#form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("#text").value.trim();
  if (!text) return;
  items.push({ id: Date.now(), text, due: $("#due").value, imp: $("#imp").checked, done: false });
  $("#text").value = ""; $("#due").value = ""; $("#imp").checked = false;
  save(); render();
});

document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  filter = b.dataset.f; render();
}));

$("#clearDone").addEventListener("click", () => {
  const n = items.filter((t) => t.done).length;
  if (!n || !confirm(`완료 항목 ${n}개를 지울까요?`)) return;
  items = items.filter((t) => !t.done); save(); render();
});
$("#export").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(items, null, 1)], { type: "application/json" }));
  a.download = `할일백업_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
});
$("#import").addEventListener("click", () => $("#file").click());
$("#file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw 0;
    if (!confirm(`${data.length}개 항목으로 바꿀까요? 지금 목록은 사라집니다.`)) return;
    items = data; save(); render();
  } catch { alert("백업 파일을 읽지 못했어요"); }
  e.target.value = "";
});

save(); render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
